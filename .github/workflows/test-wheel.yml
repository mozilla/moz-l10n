name: Python Wheel Test

on:
  workflow_call:
    inputs:
      artifact-name:
        required: true
        type: string

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.14"]

    steps:
      - name: Set path environment variables
        run: |
          echo "STAGE_DIR=${{ runner.temp }}/staged_test" >> $GITHUB_ENV
          echo "TEST_DIR=${{ runner.temp }}/staged_test/python" >> $GITHUB_ENV

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download built wheel artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact-name }}
          path: dist

      - name: Stage tests outside repository
        run: |
          mkdir -p ${{ env.TEST_DIR }}
          cp -r python/tests ${{ env.TEST_DIR }}/
          cp -r schemas ${{ env.STAGE_DIR }}/

      - name: Prep environment & install wheel
        working-directory: ${{ env.TEST_DIR }}
        run: |
          uv venv .venv --python ${{ matrix.python-version }}
          WHEEL=$(echo "${{ github.workspace }}/dist/"*.whl)
          uv pip install "${WHEEL}[xml]"
          uv pip install pytest jsonschema pytest-subtests

      - name: Run Test
        working-directory: ${{ env.TEST_DIR }}
        run: uv run pytest -vv
