name: Publish release

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write # Required for OIDC
  contents: read

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm publish -w js

  pypi-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: '3.12'
      - run: uv sync --dev --all-packages
      - run: uv run pytest -vv
      - run: uv build --project python -o python/dist
      - uses: actions/upload-artifact@v4
        with:
          name: python-wheel-artifact
          path: python/dist/*

  pypi-test:
    needs: pypi-build
    uses: ./.github/workflows/test-wheel.yml
    with:
      artifact-name: python-wheel-artifact

  pypi-publish:
    needs: pypi-test
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/moz.l10n
    steps:
      - uses: actions/download-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-wheel-artifact
          path: python/dist
      - uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1
        with:
          packages-dir: python/dist
